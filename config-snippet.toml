# Merge this snippet into ~/.codex/config.toml or a trusted project .codex/config.toml.
# Custom agent files pin their models. Architect, reviewer, and debugger leave
# reasoning effort to Main: architect uses medium/high; reviewer and debugger use high/xhigh.

model = "gpt-6-astra"
model_reasoning_effort = "xhigh"

[features]
multi_agent_v2 = true

[agents]
enabled = true
interrupt_message = true
